[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frozen-vlm-wvad"
dynamic = ["version"]
description = "NWCC, a normality-weighted context contrast for weakly supervised video anomaly localisation on frozen vision-language features"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "Jiha Kim" },
  { name = "Seunghyun Park" },
  { name = "Hyunhee Park" },
]
dependencies = [
  "torch>=2.1",
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.16,<0.17"]
prep = ["opencv-python>=4.8"]
# E021 dense extraction, pinned (torch is installed separately for its CUDA build, README)
extract = ["opencv-python==4.13.0.90", "transformers==5.0.0", "numpy==2.2.6"]

[tool.setuptools.dynamic]
version = { attr = "wvad.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
