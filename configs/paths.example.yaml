# Copy to configs/paths.yaml (git-ignored) and edit for this machine.
# - Relative entries are resolved against feature_root; anchored entries are used as is.
# - ~ and $VARS are expanded. A relative feature_root is taken relative to this file.
# - On Windows write forward slashes (F:/data/features) or single quotes; inside double
#   quotes YAML treats backslashes as escape characters.
# - The environment variable WVAD_PATHS can point to another file.

feature_root: /path/to/feature_root

features:
  # UCF-Crime: 32 segments per video, one 8-frame clip per segment
  ucf_xcb: features_xclip_base
  ucf_xcl: features_xclip_large
  ucf_siglip: features_siglip_so400m
  # XD-Violence: same segmentation
  xdv_xcb: features_xdviolence_xcb
  xdv_xcl: features_xdviolence_xcl
  xdv_siglip: features_xdviolence_siglip_so400m

annotations:
  # UCA (Yuan et al., CVPR 2024) sentence timestamps for UCF-Crime; diagnostics only
  uca: annotations/uca

# Original videos (E021 dense extraction only): the folder holding Anomaly-Detection-Dataset/
# (UCF-Crime, manifest rel_paths) and XD-Violence/train/<name>.mp4. The dense caches and the
# caches derived from them go to <feature_root>/<dataset>_<encoder>_d16/.
raw_video_root: /path/to/raw_videos
